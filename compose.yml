services:
  postgres:
    image: postgres:17
    container_name: heisenberg_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: heisenberg
      POSTGRES_PASSWORD: heisenberg_dev
      POSTGRES_DB: heisenberg_db

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: